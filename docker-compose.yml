version: '3.8'

services:
  trading-middleware:
    image: agents-middleware:${APP_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-middleware
    ports:
      - "${PORT:-8082}:${PORT:-8082}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8082}
      API_PREFIX: ${API_PREFIX:-api/v1}

      # Database Configuration (external)
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_SSL: ${DATABASE_SSL:-false}

      # JWT Configuration (from .env)
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-300}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-600}

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-3}
      RATE_LIMIT_LOCKOUT_DURATION_MS: ${RATE_LIMIT_LOCKOUT_DURATION_MS:-900000}

      # Backend Integration (external)
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      BACKEND_LOGIN_ENDPOINT: ${BACKEND_LOGIN_ENDPOINT:-/auth/login}
      BACKEND_REFRESH_ENDPOINT: ${BACKEND_REFRESH_ENDPOINT:-/auth/refresh}
      BACKEND_USER_ENDPOINT: ${BACKEND_USER_ENDPOINT:-/users/{userId}}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-30000}

      # Logging & CORS
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}

      # Password Validation
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 8082) + '/api/v1/health', (response) => { if (response.statusCode !== 200) process.exit(1); response.resume(); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s